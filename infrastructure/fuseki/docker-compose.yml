version: '3.8'

services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: edusmart-fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      # Default credentials for local development access to web UI
      - ADMIN_PASSWORD=admin
      # Optional JVM heap memory allocation
      - JVM_ARGS=-Xmx2048M
    volumes:
      # Persistent storage directory for Fuseki databases and configurations
      # No datasets are automatically generated in Phase 1
      - fuseki-data:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fuseki-data:
    name: edusmart-fuseki-data
